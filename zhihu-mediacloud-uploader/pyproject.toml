[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhihu-mediacloud-uploader"
version = "0.1.5"
requires-python = ">=3.10"
dependencies = [
    "oss2==2.19.1",
    "requests>=2.28.0",
    "mcp>=1.9.0,<2.0.0",
    "Pillow==12.3.0",
    "pillow-heif>=1.4.0",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
dev = ["ruff==0.11.11"]

[project.scripts]
zhihu-mediacloud-uploader = "mediacloud_uploader.mcp_server:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]
ignore = ["E221"]

[tool.setuptools.packages.find]
include = ["mediacloud_uploader*"]
